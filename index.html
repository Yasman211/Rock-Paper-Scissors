<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R-P-S game</title>
    <link rel="stylesheet" href="style.css">
    <script src="java.js" defer></script>
</head>
<body>
    <header>
        <h1>Rock Paper Scissors Game</h1>
    </header>

    <h3>Choose one of the below</h3>

    <div id="userbtns">
        <button id="Rockbtn" onclick= "finaldecision('Rock')"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3iotVuQZcnyoSG1oL_QUzqGXrtVBpXoZ-X_wWZ83hhR2LHXWPoj9h-YQ&s=10" alt=""></button>
        <button id="Paperbtn" onclick= "finaldecision('Paper')"><img src="https://image.pngaaa.com/779/3313779-middle.png" alt=""></button>
         <button id="Scissorsbtn" onclick= "finaldecision('Scissors')"><img src="https://i.pinimg.com/474x/67/eb/fd/67ebfd32e898b4ec3ae4e59ae33832c8.jpg" alt=""></button>
    </div>

    <header>
        <h1 id="choicesMade ">
            Choices Made:
        </h1>
    </header>
    <div id="choicesBar">
        <h2 id='imageInput'>User's Choice</h2>
        <h2 id='imageInput'>Computer's choice: </h2>
    </div>
    <div id="countBar">
        <h2 id='counter-user'>User Wins: 0 </h2>
        <h2 id='counter-computer'>Computer's Wins: 0 </h2>
    </div>
    <div id="actualChoices">
        <h2 id='imageInput21'>-</h2>
        <h2 id='imageInput22'>-</h2>
    </div>
        
    <header id="header-results">
        <h2 id="result">Result: </h2>
    </header>
   
    
    
</body> 
</html>
